name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx expo export --platform web
        env:
          CI: true
          EXPO_BASE_URL: calorie_counter

      - name: Inject PWA tags, no-cache, and service worker into index.html
        run: |
          HASH="${GITHUB_SHA:0:7}"
          sed -i 's|</title>|</title>\n    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />\n    <meta http-equiv="pragma" content="no-cache" />\n    <link rel="manifest" href="/calorie_counter/manifest.json?v='${HASH}'" />\n    <link rel="apple-touch-icon" href="/calorie_counter/icon-192.png?v='${HASH}'" />\n    <meta name="apple-mobile-web-app-capable" content="yes" />\n    <meta name="apple-mobile-web-app-status-bar-style" content="default" />\n    <meta name="apple-mobile-web-app-title" content="Calorías" />|' dist/index.html
          sed -i 's|</body>|<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("/calorie_counter/sw.js?v='${HASH}'")})}</script>\n</body>|' dist/index.html

      - name: Copy PWA files and version SW
        run: |
          cp -r public/* dist/
          HASH="${GITHUB_SHA:0:7}"
          VERSION=$(node -p "require('./package.json').version")
          echo "// build: v${VERSION}-${HASH}" >> dist/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
