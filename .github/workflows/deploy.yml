name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx expo export --platform web
        env:
          CI: true
          EXPO_ROUTER_BASE: /calorie_counter

      - name: Fix asset paths for GitHub Pages subpath
        run: |
          echo "=== Before fix ==="
          grep -oE '(src|href)="/[^"]+' dist/index.html || echo "no matches"
          echo ""

          find dist -name "*.html" -exec sed -i \
            -e 's|href="/_expo|href="/calorie_counter/_expo|g' \
            -e 's|src="/_expo|src="/calorie_counter/_expo|g' \
            -e 's|href="/manifest|href="/calorie_counter/manifest|g' \
            -e 's|href="/icon-|href="/calorie_counter/icon-|g' \
            {} +

          find dist -name "*.css" -exec sed -i \
            -e 's|url(/_expo|url(/calorie_counter/_expo|g' \
            {} +

          echo "=== After fix ==="
          grep -oE '(src|href)="/[^"]+' dist/index.html || echo "no matches"

      - name: Copy PWA files
        run: cp -r public/* dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
