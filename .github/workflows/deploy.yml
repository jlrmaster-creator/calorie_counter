name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx expo export --platform web
        env:
          CI: true
          EXPO_ROUTER_BASE: /calorie_counter
          EXPO_PUBLIC_URL: /calorie_counter

      - name: Fix all absolute paths for GitHub Pages subpath
        run: |
          echo "=== Files in dist before fix ==="
          find dist -type f | head -30
          echo ""
          echo "=== Paths in index.html before fix ==="
          grep -oE '(src|href)="/[^"]+' dist/index.html || true
          echo ""

          # Fix in all HTML files
          find dist -name "*.html" -exec sed -i \
            -e 's|href="/_expo|href="/calorie_counter/_expo|g' \
            -e 's|src="/_expo|src="/calorie_counter/_expo|g' \
            -e 's|href="/manifest|href="/calorie_counter/manifest|g' \
            -e 's|href="/icon-|href="/calorie_counter/icon-|g' \
            {} +

          # Fix in all CSS files
          find dist -name "*.css" -exec sed -i \
            -e 's|url(/_expo|url(/calorie_counter/_expo|g' \
            {} +

          echo "=== Paths in index.html after fix ==="
          grep -oE '(src|href)="/[^"]+' dist/index.html || true

      - name: Copy PWA files
        run: cp -r public/* dist/

      - name: Verify files
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo ""
          echo "=== Has index.html? ==="
          test -f dist/index.html && echo "YES" || echo "NO"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
