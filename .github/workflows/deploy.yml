name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx expo export --platform web
        env:
          CI: true

      - name: Inject router base path into JS bundle
        run: |
          echo "=== Before injection ==="
          grep -rl "EXPO_ROUTER_BASE" dist/ || echo "No EXPO_ROUTER_BASE references found"

          # Replace process.env.EXPO_ROUTER_BASE with string literal in all JS files
          find dist -name "*.js" -exec sed -i \
            's|process\.env\.EXPO_ROUTER_BASE|"/calorie_counter"|g' {} +

          echo "=== After injection ==="
          grep -rl "calorie_counter" dist/ | head -10

      - name: Fix asset paths for GitHub Pages subpath
        run: |
          find dist -name "*.html" -exec sed -i \
            -e 's|href="/_expo|href="/calorie_counter/_expo|g' \
            -e 's|src="/_expo|src="/calorie_counter/_expo|g' \
            {} +

          find dist -name "*.css" -exec sed -i \
            -e 's|url(/_expo|url(/calorie_counter/_expo|g' \
            {} +

      - name: Copy PWA files
        run: cp -r public/* dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
